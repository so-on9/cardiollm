apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cardiollm
  namespace: cardiollm
spec:
  ingressClassName: nginx
  rules:
    - host: cardiollm.example.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cardiollm-proxy
                port:
                  number: 80
