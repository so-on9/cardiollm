services:
  proxy:
    build: .
    container_name: cardio-proxy-k8s-dev
    ports:
      - "${PROXY_BIND:-127.0.0.1}:${PROXY_PORT:-8000}:8000"
    environment:
      API_KEY: ${API_KEY:-devkey}
      UI_PASSWORD: ${UI_PASSWORD:-changeme}
      SESSION_HOURS: ${SESSION_HOURS:-8}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DOCS_ENABLED: ${DOCS_ENABLED:-false}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-6}
      LOGIN_WINDOW_SECONDS: ${LOGIN_WINDOW_SECONDS:-900}
      LOGIN_BLOCK_SECONDS: ${LOGIN_BLOCK_SECONDS:-900}
      KEEP_ALIVE: ${KEEP_ALIVE:-30m}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      OLLAMA_URL: ${OLLAMA_URL:-${OLLAMA_BASE_URL:-http://replace-with-protected-ollama-host:30678}}
      OLLAMA_TRANS_MODEL: ${OLLAMA_TRANS_MODEL}
      OLLAMA_SUM_MODEL: ${OLLAMA_SUM_MODEL}
      TERM_RAG_ENABLED: ${TERM_RAG_ENABLED:-false}
      SUMMARY_RAG_ENABLED: ${SUMMARY_RAG_ENABLED:-true}
      IMAGE_BACKEND: ${IMAGE_BACKEND:-local_warp}
      IMAGE_MODEL: ${IMAGE_MODEL:-Local anatomical warp}
      COMFYUI_IMAGE_SIZE: ${COMFYUI_IMAGE_SIZE:-512}
      COMFYUI_DENOISE: ${COMFYUI_DENOISE:-0.42}
    restart: unless-stopped
