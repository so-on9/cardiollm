services:
  proxy:
    build: .
    container_name: cardio-proxy-k8s-dev
    ports:
      - "${PROXY_BIND:-0.0.0.0}:${PROXY_PORT:-8000}:8000"
    environment:
      API_KEY: ${API_KEY}
      UI_PASSWORD: ${UI_PASSWORD}
      SESSION_HOURS: ${SESSION_HOURS:-8}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      KEEP_ALIVE: ${KEEP_ALIVE:-30m}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_TRANS_MODEL: ${OLLAMA_TRANS_MODEL}
      OLLAMA_SUM_MODEL: ${OLLAMA_SUM_MODEL}
    restart: unless-stopped
