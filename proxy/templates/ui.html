<!doctype html>
<html lang="zh-TW" data-theme="dark">
<head>
<meta charset="utf-8">
<title>台中榮總心臟科翻譯/摘要LLM</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg-dark: #050505;
    --card-bg: rgba(20, 20, 25, 0.6);
    --border: rgba(255, 255, 255, 0.1);
    --accent: #3b82f6;
    --accent-glow: rgba(59, 130, 246, 0.5);
    --text-main: #f1f5f9;
    --text-muted: #94a3b8;
    --danger: #ef4444;
    --danger-glow: rgba(239, 68, 68, 0.6);
    --input-bg: rgba(0,0,0,0.3);
    /* 心臟圖背景：深色模式用淡灰 */
    --viz-bg: #e2e8f0; 
    --viz-border: rgba(255, 255, 255, 0.5);
  }

  [data-theme="light"] {
    --bg-dark: #f0f4f8;
    --card-bg: rgba(255, 255, 255, 0.7);
    --border: rgba(0, 0, 0, 0.1);
    --accent: #2563eb;
    --accent-glow: rgba(37, 99, 235, 0.3);
    --text-main: #1e293b;
    --text-muted: #64748b;
    --danger: #dc2626;
    --danger-glow: rgba(220, 38, 38, 0.4);
    --input-bg: rgba(255,255,255,0.8);
    --viz-bg: rgba(255, 255, 255, 0.4);
    --viz-border: rgba(0, 0, 0, 0.1);
  }

  body {
    margin: 0;
    background-color: var(--bg-dark);
    color: var(--text-main);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    transition: background-color 0.3s ease, color 0.3s ease;
    overflow-x: hidden;
    overflow-y: auto;
  }
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-image:
      radial-gradient(circle at 10% 20%, var(--accent-glow) 0%, transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.1) 0%, transparent 40%);
    z-index: -1;
    pointer-events: none;
    opacity: 0.5;
  }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #777; }

  .wrap {
    max-width: 1600px;
    margin: 0 auto;
    padding: 30px;
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 30px;
    min-height: 100vh;
    box-sizing: border-box;
  }

  .glass-panel {
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    transition: all 0.3s ease;
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
  }

  /* 桌機：可以保留側欄黏住（你想要也可保留） */
  .sidebar{
    height: fit-content;
    position: sticky;
    top: 30px;
    align-self: start;
  }

  /* 20260119手機：關掉 sticky，讓整頁一起滾動，不會互相覆蓋 */
  @media (max-width: 1100px) {
    .sidebar{
      position: static !important;
      top: auto !important;
    }
    .wrap{
      min-height: auto;   /* 避免 100vh 造成怪的內部捲動感 */
    }
  }

  .glass-panel:hover {
    border-color: var(--accent);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
  }

  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .brand {
    font-size: 20px;
    font-weight: 700;
    color: var(--text-main);
    letter-spacing: 0.5px;
  }

  label {
    display: block;
    font-size: 13px;
    color: var(--text-muted);
    margin: 15px 0 6px;
    font-weight: 600;
  }
  
  select, input {
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--border);
    color: var(--text-main);
    padding: 10px;
    border-radius: 10px;
    outline: none;
    font-size: 14px;
    transition: 0.2s;
    box-sizing: border-box;
  }
  select:focus, input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-glow);
  }
  select option { background: #1f2937; color: #fff; }
  [data-theme="light"] select option { background: #fff; color: #000; }

  .param-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  button {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    margin-top: 10px;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 80%, black));
    color: white;
    box-shadow: 0 4px 15px var(--accent-glow);
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px var(--accent-glow);
  }
  .btn-ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
  }
  .btn-ghost:hover {
    background: rgba(125,125,125,0.1);
    color: var(--text-main);
  }
  .btn-icon {
    width: 36px;
    height: 36px;
    padding: 0;
    margin: 0;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--input-bg);
    border: 1px solid var(--border);
    color: var(--text-main);
  }
  .btn-icon:hover { background: var(--border); }

  .main-area {
    display: block;
    gap: 20px;
  }

  /* ---- 心臟示意圖區 ---- */
  .viz-container{
  position: relative;
  display: flex;
  flex-direction: column;   /* ✅ 改成上下排列 */
  justify-content: flex-start;
  align-items: center;
  gap: 12px;                /* ✅ 工具列跟圖片留距離 */
  min-height: 420px;
  background: var(--viz-bg);
  border-radius: 16px;
  border: 1px solid var(--viz-border);
  overflow: hidden;
  box-shadow: inset 0 0 20px rgba(0,0,0,0.05);
  }

  /* ✅ toolbar 不用 absolute 了（不會蓋圖） */
  .viz-toolbar{
    position: relative;
    width: 100%;
    display: flex;
    flex-wrap: wrap;          /* ✅ 小螢幕自動換行 */
    gap: 10px;
    align-items: center;
    justify-content: flex-start;
    z-index: 5;
    pointer-events: auto;
  }

  /* 讓 toolbar 的 select 不要太寬（不然會擠爆） */
  .viz-toolbar select{
    width: auto;
    min-width: 160px;
  }

  #heartStack.calib-on { cursor: crosshair; }

  .heart-stack {
    position: relative;
    display: inline-block;
    width: 100%;
    max-width: 600px;   /* 圖片實際寬度上限 */
    margin-top: 36px;

    /* 2026/01/19 新增：下方加大可校準區域（比例跟圖片高度走） */
    --img-ratio: 53.3854%; /* = 533.854 / 1000 * 100% */
    --pad-ratio: 0.22;     /* 想更大就改 0.28 / 0.35 */
    padding-bottom: calc(var(--img-ratio) * var(--pad-ratio));
  }
  .heart-img {
    display: block;
    width: 100%;
    height: auto;
  }

  .heart-overlay {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .callout-group {
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .cond-text{
    fill: var(--danger);
    font-size: 22px;
    font-weight: 800;
    font-family: system-ui, sans-serif;
    paint-order: stroke;
    stroke: #fff;
    stroke-width: 3px;         /* 白邊，像你第二張圖那種可讀性 */
    stroke-linejoin: round;
  }


  .callout-group.active {
    opacity: 1;
  }

  .callout-line {
    stroke: var(--danger);
    stroke-width: 3.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 2px #fff);
  }
    /*20260119紅字說明（在底線下面） */
  .desc-text{
    fill: var(--danger);
    font-size: 22px;     /* 你要更大就調 */
    font-weight: 800;
    text-shadow: 2px 2px 0px #fff, -1px -1px 0 #fff;
    font-family: system-ui, sans-serif;
  }

  /* 20260119紅底線（在黑字下面） */
  .under-line{
    stroke: var(--danger);
    stroke-width: 6;
    stroke-linecap: round;
    filter: drop-shadow(0 0 2px #fff);
    opacity: 0;
  }
  .callout-group.active .under-line{ opacity: 1; }
  .callout-group.active .desc-text{ opacity: 1; }
  .callout-group .desc-text{ opacity: 0; } /* 沒啟用就隱藏 */

  .callout-dot {
    fill: var(--danger);
    stroke: #fff;
    stroke-width: 1px;
  }

  .callout-text {
    fill: var(--danger);
    font-size: 30px;
    font-weight: 800;
    text-shadow:
      2px 2px 0px #fff,
      -1px -1px 0 #fff;
    font-family: system-ui, sans-serif;
  }
  .callout-sub {
    fill: #000;
    font-size: 25px;
    font-weight: 700;
    text-shadow: 1px 1px 0px #fff;
  }

  /* 20260119紅底線（在黑字底下的強調線） */
  .line{
    stroke: var(--danger);
    stroke-width: 6;
    stroke-linecap: round;
    filter: drop-shadow(0 0 2px #fff);
    opacity: 0;
  }

  /* 只有在該標記啟用時才顯示 */
  .callout-group.active .line{
    opacity: 1;
  }


  textarea {
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text-main);
    font-family: monospace;
    font-size: 14px;
    line-height: 1.6;
    resize: none;
    outline: none;
    height: 100%;
    min-height: 150px;
  }
  .results-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-top: 20px;
  }
  .output-content {
    min-height: 200px;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    color: var(--text-main);
  }
  .warn-badge {
    color: #fbbf24;
    font-size: 13px;
    margin-top: 10px;
    font-weight: bold;
  }
  [data-theme="light"] .warn-badge { color: #d97706; }

  @media (max-width: 1100px) {
    .wrap { grid-template-columns: 1fr; display: block; }
    .results-grid { grid-template-columns: 1fr; }
    .glass-panel { margin-bottom: 20px; }
      /* 1) 左側設定欄已經改成 static，就不動 */

    /* 2) 輸入框 + 心臟圖：改成單欄 */
    .main-area > div:first-child{
      grid-template-columns: 1fr !important;
      min-height: auto !important;
    }

    /* 3) 心臟圖卡片縮 padding，不要浪費空間 */
    .viz-container{
      min-height: auto !important;
      padding: 14px !important;
    }

    /* 4) 圖片容器吃滿寬 + 移除 max-width 限制 */
    .heart-stack{
      max-width: 100% !important;
      width: 100% !important;
      margin-top: 8px !important;
    }

    /* 5) 讓工具列更好用 */
    .viz-toolbar{
      gap: 8px !important;
    }
    .viz-toolbar select{
      width: 100% !important;
      min-width: 0 !important;
    }
    #btnCalib, #btnResetAnchors{
      width: auto !important;
    }

    /* 6) 讓整張圖不要被「固定高度」壓到變小 */
    .heart-img{
      width: 100% !important;
      height: auto !important;
    }
  }
</style>
</head>
<body>

<div class="wrap">
  <aside class="glass-panel sidebar">
    <div class="header-row">
       <div class="brand">台中榮總心臟科<br>翻譯/摘要LLM</div>
       <button id="themeToggle" class="btn-icon" title="切換主題">🌙</button>
    </div>
    
    <label>翻譯模型</label>
    <select id="transModel"></select>
    
    <label>摘要模型</label>
    <select id="sumModel"></select>
    
    <label>風格</label>
    <select id="style">
      <option>Clinical</option>
      <option>Academic</option>
      <option>Patient-friendly</option>
    </select>

    <label>翻譯設定 (Max Tokens / Temp)</label>
    <div class="param-group">
        <input id="maxT" type="number" value="2048">
        <input id="tempT" type="number" step="0.1" value="0.1">
    </div>

    <label>摘要設定 (Max Tokens / Temp)</label>
    <div class="param-group">
        <input id="maxS" type="number" value="1024">
        <input id="tempS" type="number" step="0.1" value="0.2">
    </div>

    <label>Top P (0.1 - 1.0)</label>
    <input id="topP" type="number" step="0.05" value="0.9">

    <div style="margin-top:25px; border-top:1px solid var(--border); padding-top:15px;">
      <button id="btn-pipeline" class="btn-primary">開始分析</button>
      <button id="btn-clear" class="btn-ghost">清除重置</button>
      <button id="logout" class="btn-ghost" style="color:var(--danger); border-color:var(--border);">登出</button>
    </div>
  </aside>

  <main class="main-area">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap:20px; min-height: 420px;">
      <div class="glass-panel">
        <div style="font-weight:700; color:var(--accent); margin-bottom:10px; letter-spacing:1px;">原始報告輸入</div>
        <textarea id="src" placeholder="請貼上心臟超音波報告全文..."></textarea>
      </div>

      <!-- 心臟示意圖 + 標註 -->
      <div class="glass-panel viz-container">
      <div class="viz-toolbar">
      <select id="calibTarget" title="選擇要校準的標記">
        <option value="ao">AO 主動脈</option>
        <option value="pa">PA 肺動脈</option>
        <option value="la">LA 左心房</option>
        <option value="ra">RA 右心房</option>
        <option value="lv">LV 左心室</option>
        <option value="rv">RV 右心室</option>
      </select>
        <button id="btnCalib" type="button" class="btn-ghost" style="margin:0; padding:8px 10px; width:auto;">
          校準模式：關
        </button>
        <button id="btnResetAnchors" type="button" class="btn-ghost" style="margin:0; padding:8px 10px; width:auto;">
          重置座標
        </button>
        <div id="calibHint" style="font-size:12px; color:var(--text-muted); margin-left:8px;">
          （開啟後：點一下圖上想標的位置）
        </div>
      </div>
      <div id="heartStack" class="heart-stack">
        <img id="heartImg" src="/static/Heart_diagram_nobg.png" class="heart-img" alt="Heart Anatomy">

        <!-- viewBox 改成符合 1920x1025 的比例：1000 x 533.854 -->
        <svg id="heartSvg" class="heart-overlay" viewBox="0 0 1000 651.302" preserveAspectRatio="none">
          <!-- 主動脈 -->
          <g id="label-ao" class="callout-group">
            <line class="under-line" x1="-55" y1="14" x2="55" y2="14"></line>
            <text class="desc-text" x="0" y="44" text-anchor="middle" id="desc-ao">--</text>
          </g>


          <!-- 肺動脈 -->
          <g id="label-pa" class="callout-group">
            <line class="under-line" x1="-55" y1="14" x2="55" y2="14"></line>
            <text class="desc-text" x="0" y="40" text-anchor="middle" id="desc-pa">--</text>
          </g>

          <!-- 左心房 -->
          <g id="label-la" class="callout-group">
            <line class="under-line" x1="-55" y1="14" x2="55" y2="14"></line>
            <text class="desc-text" x="0" y="44" text-anchor="middle" id="desc-la">--</text>
          </g>

          <!-- 右心房 -->
          <g id="label-ra" class="callout-group">
            <line class="under-line" x1="-55" y1="14" x2="55" y2="14"></line>
            <text class="desc-text" x="0" y="44" text-anchor="middle" id="desc-ra">--</text>
          </g>

          <!-- 左心室 -->
          <g id="label-lv" class="callout-group">
            <line class="under-line" x1="-55" y1="14" x2="55" y2="14"></line>
            <text class="desc-text" x="0" y="44" text-anchor="middle" id="desc-lv">--</text>
          </g>

          <!-- 右心室 -->
          <g id="label-rv" class="callout-group">
            <line class="under-line" x1="-55" y1="14" x2="55" y2="14"></line>
            <text class="desc-text" x="0" y="44" text-anchor="middle" id="desc-rv">--</text>
          </g>
        </svg>
        </div>
      </div>
    </div>

    <div class="results-grid">
      <div class="glass-panel">
        <div style="font-weight:700; color:var(--text-muted); margin-bottom:15px;">翻譯結果</div>
        <div id="trans" class="output-content"></div>
        <div id="warnT" class="warn-badge"></div>
      </div>
      <div class="glass-panel">
        <div style="font-weight:700; color:var(--text-muted); margin-bottom:15px;">臨床摘要</div>
        <div id="sum" class="output-content"></div>
        <div id="warnS" class="warn-badge"></div>
      </div>
    </div>
  </main>
</div>

<script>
const KEY = "supersecret";

/* ==============================
 * 0) 圖片/座標：固定 viewBox 比例 (1000 x 533.854)
 *    + 校準模式 (點一下就記住位置)
 * ============================== */
const VB_W = 1000;
const VB_H_BASE = 533.854;

// 20260119跟 CSS 的 --pad-ratio 一樣
const PAD_RATIO = 0.22;

// 20260119變成「圖片高度 + 留白高度」
const VB_H = +(VB_H_BASE * (1 + PAD_RATIO)).toFixed(3);

const ANCHOR_KEY = "heart_anchors_v2";

/** 預設座標（只是初值，之後你用校準模式點黑字會覆蓋） */
const DEFAULT_ANCHORS = {
  ao: { x: 637.16, y: 27.06 },
  pa: { x: 702.56, y: 105.53 },
  la: { x: 739.93, y: 178.41 },
  ra: { x: 203.68, y: 269.96 },
  lv: { x: 781.03, y: 327.89 },
  rv: { x: 418.55, y: 514.74 },
};

function loadAnchors(){
  try{
    const raw = localStorage.getItem(ANCHOR_KEY);
    if(!raw) return structuredClone(DEFAULT_ANCHORS);
    const obj = JSON.parse(raw);
    // 補缺項
    return { ...structuredClone(DEFAULT_ANCHORS), ...(obj||{}) };
  }catch(e){
    return structuredClone(DEFAULT_ANCHORS);
  }
}
function saveAnchors(a){
  localStorage.setItem(ANCHOR_KEY, JSON.stringify(a));
}

let anchors = loadAnchors();

function applyAnchor(id){
  const g = document.getElementById("label-" + id);
  if(!g || !anchors[id]) return;
  g.setAttribute("transform", `translate(${anchors[id].x},${anchors[id].y})`);
}
function applyAllAnchors(){
  ["ao","pa","la","ra","lv","rv"].forEach(applyAnchor);
}

/* 校準模式：點圖設定座標 */
let calibOn = false;

function setCalibUI(){
  const stack = document.getElementById("heartStack");
  const btn = document.getElementById("btnCalib");
  stack.classList.toggle("calib-on", calibOn);
  btn.textContent = calibOn ? "校準模式：開" : "校準模式：關";
}

document.addEventListener("DOMContentLoaded", () => {
  applyAllAnchors();

  document.getElementById("btnCalib").onclick = () => {
    calibOn = !calibOn;
    setCalibUI();
  };

  document.getElementById("btnResetAnchors").onclick = () => {
    anchors = structuredClone(DEFAULT_ANCHORS);
    saveAnchors(anchors);
    applyAllAnchors();
    alert("已重置為預設座標（你可再開啟校準模式重新點選）");
  };

  document.getElementById("heartStack").addEventListener("click", (ev) => {
  if(!calibOn) return;

  const stack = document.getElementById("heartStack");
  const rect = stack.getBoundingClientRect();  // ✅ 用整個 stack（含留白）

  const x = (ev.clientX - rect.left) / rect.width  * VB_W;
  const y = (ev.clientY - rect.top)  / rect.height * VB_H;

  const id = document.getElementById("calibTarget").value;
  anchors[id] = { x: +x.toFixed(2), y: +y.toFixed(2) };
  saveAnchors(anchors);
  applyAnchor(id);

  document.getElementById("calibHint").textContent =
    `已設定 ${id.toUpperCase()} 座標：(${anchors[id].x}, ${anchors[id].y})`;
  });



  setCalibUI();
});

/* ---------------------------------------------------
 * 1. 關鍵字 → 心臟區域 map
 *   - 同時支援英文縮寫、英文全名、中文名稱
 *   - 把常見寫法像 "LA("、"LA:" 也加進來
 * --------------------------------------------------*/
const MAP = {
  ao: {
    k: [
      "aorta", "aortic", "root", "av ", "ar ",
      " ao ", " ao(", "ao(", "ao:", "主動脈"
    ],
    name: "AO"
  },
  la: {
    k: [
      "left atrium", "left atrial",
      " la ", " la(", "la(", "la:",
      "左心房"
    ],
    name: "LA"
  },
  lv: {
    k: [
      "left ventricle", "left ventricular",
      " lv ", " lv(", "lv(", "lv:",
      "lvef", "lvh", "concentric lvh",
      "左心室"
    ],
    name: "LV"
  },
  ra: {
    k: [

/* ---------------------------------------------------
 * 3. 依翻譯 + 摘要文字啟動標註
 * --------------------------------------------------*/
function highlight(text) {
  if (!text) return;

  const low = text.toLowerCase();
  const sentences = low.split(/[。！？\.\n]/);

  // 先清掉之前的 active & 說明文字
  document.querySelectorAll('.callout-group').forEach(g => {
    g.classList.remove('active');
  });
  ["ao","la","lv","ra","rv","pa"].forEach(id => {
    const desc = document.getElementById("desc-" + id);
    if (desc) {
      desc.textContent = "--";
      desc.style.fill = "#000";
    }
  });

  // ✅ 改：每個區域可以累積多個狀況
  const status = {}; // id -> { hit: true, descs: Set() }

  sentences.forEach(sent => {
    const s = sent.trim();
    if (!s) return;

    for (let id in MAP) {
      const keys = MAP[id].k;

      if (keys.some(k => s.includes(k))) {
        if (!status[id]) status[id] = { hit: true, descs: new Set() };

        // ✅ 改：不要 break，全部掃完把符合的都加進去
        for (let c of CONDS) {
          if (s.includes(c.k)) {
            status[id].descs.add(c.label);
          }
        }
      }
    }
  });

  for (let id in status) {
    if (!status[id].hit) continue;

    const g = document.getElementById("label-" + id);
    if (g) g.classList.add("active");

    const d = document.getElementById("desc-" + id);
    if (!d) continue;

    const arr = Array.from(status[id].descs).filter(Boolean);

    if (arr.length) {
      d.textContent = arr.slice(0, 2).join("、");   
      d.style.fill = "var(--danger)";
    } else {
      d.textContent = "有提及";
      d.style.fill = "#000";
    }
  }
}


/* ---------------------------------------------------
 * 4. API 小工具
 * --------------------------------------------------*/
async function api(path, body) {
  const r = await fetch(path, {
    method: body ? 'POST':'GET', 
    headers: {'x-api-key': KEY, 'Content-Type': 'application/json'},
    body: body ? JSON.stringify(body) : null
  });
  if(!r.ok) throw new Error((await r.json()).detail || r.statusText);
  return await r.json();
}

/* ---------------------------------------------------
 * 5. 初始化模型清單
 * --------------------------------------------------*/
async function init() {
  try {
    const data = await api('/models');
    const all = (data.names || []).sort();
    const tSel = document.getElementById('transModel');
    const sSel = document.getElementById('sumModel');
    
    const tModels = all.filter(n => n.toLowerCase().includes('translator'));
    const sModels = all.filter(n => n.toLowerCase().includes('summarizer'));
    
    tSel.innerHTML=''; sSel.innerHTML='';
    (tModels.length?tModels:all).forEach(n=>tSel.add(new Option(n,n)));
    (sModels.length?sModels:all).forEach(n=>sSel.add(new Option(n,n)));

    if(data.defaults?.translator && tModels.includes(data.defaults.translator)) {
        tSel.value = data.defaults.translator;
    }
    if(data.defaults?.summarizer && sModels.includes(data.defaults.summarizer)) {
        sSel.value = data.defaults.summarizer;
    }
  } catch(e) {}
}

/* ---------------------------------------------------
 * 6. 深淺色主題
 * --------------------------------------------------*/
const themeBtn = document.getElementById('themeToggle');
function initTheme() {
  const saved = localStorage.getItem('theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = saved || (prefersDark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
  themeBtn.textContent = theme === 'dark' ? '☀' : '☾';
}
themeBtn.onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  themeBtn.textContent = next === 'dark' ? '☀' : '☾';
};

/* ---------------------------------------------------
 * 7. 打字機效果 + highlight
 * --------------------------------------------------*/
function typeShow(el, text, done) {
  el.textContent = ''; 
  if(!text) { if(done) done(); return; }
  let i=0;
  function loop() {
    el.textContent += text.slice(i, i+5);
    if(i % 50 === 0) highlight(el.textContent); 
    i+=5;
    if(i<text.length) setTimeout(loop, 10);
    else { highlight(text); if(done) done(); }
  }
  loop();
}

/* ---------------------------------------------------
 * 8. Pipeline 按鈕
 * --------------------------------------------------*/
document.getElementById('btn-pipeline').onclick = async () => {
  const src = document.getElementById('src').value.trim();
  if(!src) return alert('請輸入報告內容');
  
  const elT = document.getElementById('trans');
  const elS = document.getElementById('sum');
  elT.textContent = '分析中...'; elS.textContent = '等待中...';
  document.getElementById('warnT').textContent = '';
  document.getElementById('warnS').textContent = '';

  try {
    const res = await api('/pipeline', {
      source: src,
      translator_model: document.getElementById('transModel').value,
      summarizer_model: document.getElementById('sumModel').value,
      style: document.getElementById('style').value,
      max_new_tokens_translate: +document.getElementById('maxT').value,
      temperature_translate: +document.getElementById('tempT').value,
      max_new_tokens_summary: +document.getElementById('maxS').value,
      temperature_summary: +document.getElementById('tempS').value,
      top_p: +document.getElementById('topP').value,
      glossary: []
    });

    const fullText = (res.translation + "\n" + res.summary);

    typeShow(elT, res.translation, () => {
      typeShow(elS, res.summary, () => {
        highlight(fullText);
      });
    });

    if(res.warn_translation_missing?.length)
      document.getElementById('warnT').textContent = '⚠️ 缺漏: ' + res.warn_translation_missing;
    if(res.warn_summary_missing?.length)
      document.getElementById('warnS').textContent = '⚠️ 缺漏: ' + res.warn_summary_missing;

  } catch(e) {
    elT.textContent = '錯誤: ' + e.message;
  }
};
